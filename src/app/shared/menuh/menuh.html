<header class="menu-header flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#f5f2f0] px-10 py-3">
  <div class="flex items-center gap-4 text-[#181411]">
    <div class="size-4">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M36.7273 44C33.9891 44 31.6043 39.8386 30.3636 33.69C29.123 39.8386 26.7382 44 24 44C21.2618 44 18.877 39.8386 17.6364 33.69C16.3957 39.8386 14.0109 44 11.2727 44C7.25611 44 4 35.0457 4 24C4 12.9543 7.25611 4 11.2727 4C14.0109 4 16.3957 8.16144 17.6364 14.31C18.877 8.16144 21.2618 4 24 4C26.7382 4 29.123 8.16144 30.3636 14.31C31.6043 8.16144 33.9891 4 36.7273 4C40.7439 4 44 12.9543 44 24C44 35.0457 40.7439 44 36.7273 44Z"
          fill="currentColor"
        ></path>
      </svg>
    </div>
    <h2 class="text-[#181411] text-lg font-bold leading-tight tracking-[-0.015em]">Sugar Boston</h2>
  </div>
  
  <!-- Navegación desktop/tablet -->
  <div class="flex flex-1 justify-end gap-8">
    <div class="nav-links flex items-center gap-9">
      <a class="text-[#181411] text-sm font-medium leading-normal" href="#">Inicio</a>
      <a class="text-[#181411] text-sm font-medium leading-normal" href="#">Menú</a>
      <a class="text-[#181411] text-sm font-medium leading-normal" href="#">Acerca de</a>
    </div>
    <button
      class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f5f2f0] text-[#181411] gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5"
    >
      <div class="text-[#181411]" data-icon="ShoppingBag" data-size="20px" data-weight="regular">
        <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor" viewBox="0 0 256 256">
          <path
            d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H40V56H216V200ZM176,88a48,48,0,0,1-96,0,8,8,0,0,1,16,0,32,32,0,0,0,64,0,8,8,0,0,1,16,0Z"
          ></path>
        </svg>
      </div>
    </button>
  </div>

  <!-- Botón menú hamburguesa para móviles -->
  <button 
    class="mobile-menu-button flex items-center justify-center w-10 h-10 p-2"
    (click)="toggleMobileMenu()"
    [attr.aria-expanded]="isMobileMenuOpen"
    aria-label="Abrir menú de navegación"
  >
    <span class="sr-only">Abrir menú</span>
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        stroke-width="2" 
        [attr.d]="isMobileMenuOpen ? 'M6 18L18 6M6 6l12 12' : 'M4 6h16M4 12h16M4 18h16'"
      ></path>
    </svg>
  </button>

  <!-- Menú móvil desplegable -->
  <div class="mobile-menu" [class.hidden]="!isMobileMenuOpen">
    <nav class="mobile-nav-links">
      <a class="text-[#181411] text-sm font-medium leading-normal" href="#" (click)="closeMobileMenu()">Inicio</a>
      <a class="text-[#181411] text-sm font-medium leading-normal" href="#" (click)="closeMobileMenu()">Menú</a>
      <a class="text-[#181411] text-sm font-medium leading-normal" href="#" (click)="closeMobileMenu()">Acerca de</a>
      <button
        class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f5f2f0] text-[#181411] gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5 mt-2"
        (click)="closeMobileMenu()"
      >
        <div class="text-[#181411]" data-icon="ShoppingBag" data-size="20px" data-weight="regular">
          <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor" viewBox="0 0 256 256">
            <path
              d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H40V56H216V200ZM176,88a48,48,0,0,1-96,0,8,8,0,0,1,16,0,32,32,0,0,0,64,0,8,8,0,0,1,16,0Z"
            ></path>
          </svg>
        </div>
        <span>Carrito</span>
      </button>
    </nav>
  </div>
</header>
